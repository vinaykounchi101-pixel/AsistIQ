name: asistiq_client
description: "AI-assisted IT Helpdesk Multi-Platform Client (SRS v3.3)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Routing & Deep Linking
  go_router: ^14.0.0

  # Secure Storage & Cache
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI Design System & Typography
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  uuid: ^4.4.0

  # Multi-platform Utilities
  file_picker: ^8.0.0+1
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
